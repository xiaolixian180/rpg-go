# 本地开发配置模板 - 复制为 config.local.yaml 并填入实际值
# cp config.example.local.yaml config.local.yaml
server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 10
  write_timeout: 10
  max_conn_per_ip: 5
  heartbeat_sec: 30
  reconnect_sec: 180
  max_request_per_sec: 30

database:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: "changeme"
  dbname: "hero_quest"
  max_idle: 10
  max_open: 100

redis:
  host: "127.0.0.1"
  port: 6379
  password: "changeme"
  db: 0

mongodb:
  uri: "mongodb://mongo_root:changeme@127.0.0.1:27017"
  database: "hero_quest"

jwt:
  secret: "change-this-to-a-long-random-string"
  expire_hours: 24

game:
  max_level: 60
  max_dungeon_layer: 30
  pvp_gold_penalty: 0.1
  pvp_honor_gain: 10
  red_name_threshold: 5
  skill_reset_cost: 1000
  teleport_cost: 100
  skill_multiplier: 1.5
  invincible_sec: 30
  pet_levelup_cost: 100
  bounty_gold_per_kill: 500
  bounty_honor_gain: 10
  boss_drop_purple: 0.1
  boss_drop_orange: 0.02
  page_size: 20
