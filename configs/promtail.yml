server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 采集 Docker 容器 stdout 日志
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      # 容器名称作为 Loki 标签
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
        regex: '/(.*)'
      # 只采集 game-server 容器
      - source_labels: ['__meta_docker_container_label_logging']
        regex: 'promtail'
        action: keep
    pipeline_stages:
      # 解析 JSON 日志，提取字段为 Loki 标签，支持按 trace_id / player_id 查询
      - json:
          expressions:
            level: level
            msg: msg
            trace_id: trace_id
            player_id: player_id
            msg_id: msg_id
            conn_id: conn_id
            cost_ms: cost_ms
      # 设置 Loki 标签（可索引，查询快）
      - labels:
          level:
          trace_id:
          player_id:
      # 设置日志时间
      - timestamp:
          source: time
          format: RFC3339
