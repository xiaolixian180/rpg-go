services:
  game-server:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - HQ_MONGODB_URI=mongodb://root:${HQ_MONGO_PASSWORD:-hero_quest_mongo_2026}@mongodb:27017
      - REDIS_HOST=redis
      - HQ_JWT_SECRET=hero-quest-secret-key
      - HQ_DATABASE_PASSWORD=hero_quest_2026
      - HQ_REDIS_PASSWORD=hero_quest_redis_2026
    restart: unless-stopped
    labels:
      logging: "promtail"          # promtail 自动发现标记
    logging:
      driver: json-file             # Docker 默认日志驱动，promtail 从文件采集
      options:
        max-size: "50m"
        max-file: "3"

  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${HQ_DATABASE_PASSWORD:-hero_quest_2026}
      - MYSQL_DATABASE=hero_quest
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: --requirepass ${HQ_REDIS_PASSWORD:-hero_quest_redis_2026}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${HQ_REDIS_PASSWORD:-hero_quest_redis_2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${HQ_MONGO_PASSWORD:-hero_quest_mongo_2026}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ========== 日志可观测性 ==========
  loki:
    image: grafana/loki:2.9.12
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:2.9.12
    depends_on:
      - loki
    volumes:
      - ./configs/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    depends_on:
      loki:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-hq_grafana_admin_2026}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  loki_data:
  grafana_data:
